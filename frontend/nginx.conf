server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;

  # Same-origin API: the HttpOnly session cookie never crosses origins.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

  # Always revalidate the page itself so a new version shows immediately.
  location = /index.html { add_header Cache-Control "no-cache, must-revalidate" always; }
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }
}
